name: Update profile chart

on:
  schedule:
    - cron: "0 18 * * *"   # every day
  workflow_dispatch:        # lets you run it manually

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate chart from GitHub data
        run: python generate_assets.py
        env:
          GH_LOGIN: iamsiamhossen
          # Optional: add a personal access token named PROFILE_TOKEN to include private contributions
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Update contribution chart"
          git push
