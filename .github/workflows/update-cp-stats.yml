name: Update CP stats card

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: # manual "Run workflow" button
  push:
    paths:
      - "scripts/generate-cp-stats.mjs"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate card
        run: node scripts/generate-cp-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cp-stats.svg assets/cp-stats.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update CP stats card"
            git push
          fi
