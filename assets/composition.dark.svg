  <line x1="1" y1="12" x2="1" y2="428" stroke="#30363d" stroke-width="1"/>

  <g stroke="#3ddc5c" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="195" y1="220" x2="283" y2="220"/>
