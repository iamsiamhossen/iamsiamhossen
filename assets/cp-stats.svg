<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" fill="none" role="img" aria-label="Competitive programming stats: Codeforces and LeetCode">
  <style>
    :root{--bg:#0d1117;--bg2:#121a24;--bd:#30363d;--tx:#e6edf3;--mu:#8b949e;--tr:#21262d;--ac:#3fb950}
    @media (prefers-color-scheme: light){:root{--bg:#ffffff;--bg2:#f6f8fa;--bd:#d0d7de;--tx:#1f2328;--mu:#656d76;--tr:#e6e9ed;--ac:#1a7f37}}
    text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{font-size:11px;font-weight:600;letter-spacing:1.6px;fill:var(--mu)}
    .name{font-size:22px;font-weight:700;fill:var(--tx)}
    .big{font-size:44px;font-weight:800;fill:var(--tx)}
    .num{font-size:22px;font-weight:700;fill:var(--tx)}
    .sub{font-size:11px;font-weight:500;letter-spacing:.8px;fill:var(--mu)}
    .mu{font-size:13px;fill:var(--mu)}
    .row{font-size:13px;font-weight:600;fill:var(--tx)}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--bg)"/>
      <stop offset="1" style="stop-color:var(--bg2)"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--ac)" stop-opacity="0"/>
      <stop offset=".5" style="stop-color:var(--ac)"/>
      <stop offset="1" style="stop-color:var(--ac)" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x=".5" y=".5" width="859" height="259" rx="14" fill="url(#bg)" style="stroke:var(--bd)"/>
  <rect x="40" y="0" width="780" height="2" fill="url(#top)"/>
  <line x1="430" y1="28" x2="430" y2="232" style="stroke:var(--bd)"/>

  <!-- CODEFORCES -->
  <g>
    <text x="32" y="44" class="lbl">CODEFORCES</text>
    <text x="32" y="74" class="name">Siam Hossen</text>
    <rect x="322" y="28" width="76" height="26" rx="13" fill="#8b949e" fill-opacity=".14" stroke="#8b949e" stroke-opacity=".55"/>
    <text x="360" y="45.5" text-anchor="middle" font-size="12" font-weight="700" fill="#8b949e">Newbie</text>

    <text x="32" y="130" class="big">823</text>
    <text x="32" y="150" class="sub">CONTEST RATING</text>
    <text x="180" y="130" class="big" style="font-size:30px">1,031</text>
    <text x="180" y="150" class="sub">MAX RATING</text>
    <text x="300" y="130" class="big" style="font-size:30px">68</text>
    <text x="300" y="150" class="sub">CONTESTS</text>

    <line x1="32" y1="172" x2="398" y2="172" style="stroke:var(--bd)"/>

    <text x="32" y="205" class="num">467</text>
    <text x="32" y="224" class="sub">SOLVED</text>
    <text x="150" y="205" class="num">883</text>
    <text x="150" y="224" class="sub">SUBMISSIONS</text>
    <text x="290" y="205" class="num">21</text>
    <text x="290" y="224" class="sub">FRIENDS</text>
  </g>

  <!-- LEETCODE -->
  <g>
    <text x="462" y="44" class="lbl">LEETCODE</text>
    <text x="462" y="74" class="name">iamsiamhossen</text>
    <text x="828" y="44" text-anchor="end" class="mu">#2133956</text>

    <circle cx="520" cy="158" r="46" stroke-width="9" style="stroke:var(--tr)"/>
    <circle cx="520" cy="158" r="46" stroke-width="9" stroke-linecap="round" stroke-dasharray="5.27 289.03" transform="rotate(-90 520 158)" style="stroke:var(--ac)"/>
    <text x="520" y="166" text-anchor="middle" class="num" style="font-size:26px">75</text>
    <text x="520" y="186" text-anchor="middle" class="sub" style="font-size:9px">SOLVED</text>

    <text x="600" y="116" class="row">Easy</text>
    <text x="832" y="116" text-anchor="end" class="mu">50 / 975</text>
    <rect x="600" y="124" width="232" height="6" rx="3" style="fill:var(--tr)"/>
    <rect x="600" y="124" width="11.9" height="6" rx="3" fill="#3fb950"/>

    <text x="600" y="158" class="row">Medium</text>
    <text x="832" y="158" text-anchor="end" class="mu">21 / 2,146</text>
    <rect x="600" y="166" width="232" height="6" rx="3" style="fill:var(--tr)"/>
    <rect x="600" y="166" width="4.0" height="6" rx="3" fill="#f0b429"/>

    <text x="600" y="200" class="row">Hard</text>
    <text x="832" y="200" text-anchor="end" class="mu">4 / 989</text>
    <rect x="600" y="208" width="232" height="6" rx="3" style="fill:var(--tr)"/>
    <rect x="600" y="208" width="4.0" height="6" rx="3" fill="#f85149"/>
  </g>
</svg>
